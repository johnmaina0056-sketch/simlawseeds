<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cereal Store</title>

<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#108244;color:#fff;padding:20px;text-align:center}
.container{width:90%;margin:auto;padding:20px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}

.product-card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.product-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.content{padding:15px}

.price{
    font-size:22px;
    color:#108244;
    font-weight:bold;
    margin:10px 0;
}

input{
    width:70px;
    padding:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#108244;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

/* FLOATING CHECKOUT BUTTON */
.checkout-btn{
    position: fixed;
    bottom: 20px;
    right: 20px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: none;

    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: white;
    font-size: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);

    transition: 0.25s ease;
}

.checkout-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 26px rgba(0,0,0,.3);
}

.checkout-btn:active{
    transform: scale(0.9);
}
</style>
</head>

<body>

<header>
    <h1>Cereal Categories</h1>
</header>

<div class="container">

<div class="grid">

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/RGeU9millet.jpg" alt="Millet">
      <div class="content">
        <h3>Millet</h3>
        <p>finger millet 2kg.</p>
        <div class="price">KSh 600</div>
        <input type="number" min="1" value="1" id="millet">
        <button onclick="addToCart('Millet',600,document.getElementById('millet').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/RlM5yRICE.jpg" alt="Rice">
      <div class="content">
        <h3>Rice</h3>
        <p>Nerica Rice 4 2KG.</p>
        <div class="price">KSh 420</div>
        <input type="number" min="1" value="1" id="rice">
        <button onclick="addToCart('Rice',420,document.getElementById('rice').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/high-quality-red-sorghumwhite-sorghum-for-sale1-0537126001552579659.jpg" alt="Sorghum">
      <div class="content">
        <h3>Sorghum</h3>
        <p>GADAM 2kg.</p>
        <div class="price">KSh 490</div>
        <input type="number" min="1" value="1" id="sorghum">
        <button onclick="addToCart('Sorghum',490,document.getElementById('sorghum').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/4FFHHwheat%20seeds.jpg" alt="Wheat">
      <div class="content">
        <h3>Wheat</h3>
        <p>Kwale 50kg.</p>
        <div class="price">KSh 5,350</div>
        <input type="number" min="1" value="1" id="wheat">
        <button onclick="addToCart('Wheat',5,350,document.getElementById('wheat').value)">Add To Cart</button>
      </div>
    </div>

</div>

</div>

<!-- FLOATING BUTTON (ONLY ICON / SHORT TEXT) -->
<button class="checkout-btn" onclick="submitOrder()">Submit Cart🛒</button>

<script>

function addToCart(name, price, quantity){

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    cart.push({
        name: name,
        price: price,
        quantity: parseInt(quantity)
    });

    localStorage.setItem('cart', JSON.stringify(cart));

    alert(name + ' added to cart');
}

function submitOrder(){

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    if(cart.length === 0){
        alert('Please add at least one cereal item to your cart.');
        return;
    }

    window.location.href = 'cart.html';
}

</script>

</body>
</html>
