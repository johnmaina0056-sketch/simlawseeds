<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Herbs Store</title>

<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#108244;color:#fff;padding:20px;text-align:center}
.container{width:90%;margin:auto;padding:20px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}

.product-card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.product-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.content{padding:15px}

.price{
    font-size:22px;
    color:#108244;
    font-weight:bold;
    margin:10px 0;
}

input{
    width:70px;
    padding:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#108244;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

/* FLOATING CHECKOUT BUTTON */
.checkout-btn{
    position: fixed;
    bottom: 20px;
    right: 20px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: none;

    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: white;
    font-size: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);

    transition: 0.25s ease;
}

.checkout-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 26px rgba(0,0,0,.3);
}

.checkout-btn:active{
    transform: scale(0.9);
}
</style>
</head>

<body>

<header>
    <h1>Herbs Store</h1>
</header>

<div class="container">

<div class="grid">

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/ibdD5dahnia.jpg" alt="Coriander">
      <div class="content">
        <h3>Coriander</h3>
        <p>Dahnia 100g.</p>
        <div class="price">KSh 75-1,100</div>
        <input type="number" min="1" value="1" id="coriander">
        <button onclick="addToCart('Coriander', 75-1,100,document.getElementById('coriander').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/Thyme-600x450_(1)1.jpg" alt="Thyme">
      <div class="content">
        <h3>Thyme</h3>
        <p>Herb Thyme 10gm.</p>
        <div class="price">KSh 835</div>
        <input type="number" min="1" value="1" id="thyme">
        <button onclick="addToCart('Thyme',835,document.getElementById('thyme').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/basil.jpg" alt="Basil">
      <div class="content">
        <h3>Basil</h3>
        <p>Herb Basil 10gm.</p>
        <div class="price">KSh 220</div>
        <input type="number" min="1" value="1" id="basil">
        <button onclick="addToCart('Basil',220,document.getElementById('basil').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/chives.png" alt="Chives">
      <div class="content">
        <h3>Chives</h3>
        <p>Herb Chives 10gm.</p>
        <div class="price">KSh 340</div>
        <input type="number" min="1" value="1" id="chives">
        <button onclick="addToCart('Chives',340,document.getElementById('chives').value)">Add To Cart</button>
      </div>
    </div>

</div>

</div>

<!-- FLOATING CHECKOUT BUTTON -->
<button class="checkout-btn" onclick="submitOrder()">Submit Cart🛒</button>

<script>

function addToCart(name, price, quantity){

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    cart.push({
        name: name,
        price: price,
        quantity: parseInt(quantity)
    });

    localStorage.setItem('cart', JSON.stringify(cart));

    alert(name + ' added to cart');
}

function submitOrder(){

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    if(cart.length === 0){
        alert('Please add at least one herb item to your cart.');
        return;
    }

    window.location.href = 'cart.html';
}

</script>

</body>
</html>
