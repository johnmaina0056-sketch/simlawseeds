<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pasture Seeds Store</title>

<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#108244;color:#fff;padding:20px;text-align:center}
.container{width:90%;margin:auto;padding:20px 0}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.product-card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.product-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.content{padding:15px}

.price{
    font-size:22px;
    color:#108244;
    font-weight:bold;
    margin:10px 0;
}

input{
    width:70px;
    padding:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#108244;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

/* FLOATING CHECKOUT BUTTON */
.checkout-btn{
    position: fixed;
    bottom: 20px;
    right: 20px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: none;

    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: white;
    font-size: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);

    transition: 0.25s ease;
}

.checkout-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 26px rgba(0,0,0,.3);
}

.checkout-btn:active{
    transform: scale(0.9);
}
</style>
</head>

<body>

<header>
    <h1>Pasture Seeds Store</h1>
</header>

<div class="container">

<div class="grid">

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/Lucerne_(Alfalfa).png" alt="Legume Pasture">
      <div class="content">
        <h3>Pasture - Legume</h3>
        <p>Lucerne Aurora 1kg.</p>
        <div class="price">KSh 350-2,845</div>
        <input type="number" min="1" value="1" id="legume">
        <button onclick="addToCart('Pasture - Legume',350-2,845,document.getElementById('legume').value)">
            Add To Cart
        </button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/OatsPile_photo-cred-Adobestock_E.jpg" alt="Oats Pasture">
      <div class="content">
        <h3>Pasture - Oats</h3>
        <p>Oats S18 1kg.</p>
        <div class="price">KSh 270</div>
        <input type="number" min="1" value="1" id="oats">
        <button onclick="addToCart('Pasture - Oats',270,document.getElementById('oats').value)">
            Add To Cart
        </button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/WPIKqBoma%20Rhode%201.jpg" alt="Grass Pasture">
      <div class="content">
        <h3>Pasture - Grass</h3>
        <p>Boma Rhodes 1kg.</p>
        <div class="price">KSh 1,550</div>
        <input type="number" min="1" value="1" id="grass">
        <button onclick="addToCart('Pasture - Grass',1,550,document.getElementById('grass').value)">
            Add To Cart
        </button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/L13srSunflower.jpg" alt="Sunflower Pasture">
      <div class="content">
        <h3>Pasture - Sunflower</h3>
        <p>H8998- Oil 1kg.</p>
        <div class="price">KSh 635</div>
        <input type="number" min="1" value="1" id="sunflower">
        <button onclick="addToCart('Pasture - Sunflower',635,document.getElementById('sunflower').value)">
            Add To Cart
        </button>
      </div>
    </div>

</div>

</div>

<!-- FLOATING CHECKOUT BUTTON -->
<button class="checkout-btn" onclick="submitOrder()">Submit Cart 🛒</button>

<script>

function addToCart(name, price, quantity){

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    cart.push({
        name: name,
        price: price,
        quantity: parseInt(quantity)
    });

    localStorage.setItem('cart', JSON.stringify(cart));

    alert(name + ' added to cart');
}

function submitOrder(){

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    if(cart.length === 0){
        alert('Please add at least one pasture item to your cart.');
        return;
    }

    window.location.href = 'cart.html';
}

</script>

</body>
</html>
