<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pulses Store</title>

<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#108244;color:#fff;padding:20px;text-align:center}
.container{width:90%;margin:auto;padding:20px 0}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.product-card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.product-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.content{padding:15px}

.price{
    font-size:22px;
    color:#108244;
    font-weight:bold;
    margin:10px 0;
}

input{
    width:70px;
    padding:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#108244;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

/* FLOATING CHECKOUT BUTTON */
.checkout-btn{
    position: fixed;
    bottom: 20px;
    right: 20px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
    border: none;

    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: white;
    font-size: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);

    transition: 0.25s ease;
}

.checkout-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 26px rgba(0,0,0,.3);
}

.checkout-btn:active{
    transform: scale(0.9);
}
</style>
</head>

<body>

<header>
    <h1>Pulses Store</h1>
</header>

<div class="container">

<div class="grid">

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/jug5IRosecoco.jpg" alt="Beans">
      <div class="content">
        <h3>Beans</h3>
        <p>Rose Coco Glp 2 2kg.</p>
        <div class="price">KSh 540</div>
        <input type="number" min="1" value="1" id="beans">
        <button onclick="addToCart('Beans',540,document.getElementById('beans').value)">
            Add To Cart
        </button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/cuFRwCowPeas%20Ken%20Kunde.jpg" alt="Cowpeas">
      <div class="content">
        <h3>Cowpeas</h3>
        <p>cowpeas k.k 2kg.</p>
        <div class="price">KSh 50-500</div>
        <input type="number" min="1" value="1" id="cowpeas">
        <button onclick="addToCart('Cowpeas',50-500,document.getElementById('cowpeas').value)">
            Add To Cart
        </button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/BCmDgGreengrams%20[KS20].jpg" alt="Greengrams">
      <div class="content">
        <h3>Greengrams</h3>
        <p>Green Gram KS20 1kg.</p>
        <div class="price">KSh 260-565</div>
        <input type="number" min="1" value="1" id="greengrams">
        <button onclick="addToCart('Greengrams',260-565,document.getElementById('greengrams').value)">
            Add To Cart
        </button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/peas_kigondoro.jpg" alt="Peas">
      <div class="content">
        <h3>Peas</h3>
        <p>Peas Kelvedon Kigondoro 1Kg.</p>
        <div class="price">KSh 240-875</div>
        <input type="number" min="1" value="1" id="peas">
        <button onclick="addToCart('Peas',240-875,document.getElementById('peas').value)">
            Add To Cart
        </button>
      </div>
    </div>

</div>

</div>

<!-- FLOATING CHECKOUT BUTTON -->
<button class="checkout-btn" onclick="submitOrder()">Submit Cart🛒</button>

<script>

function addToCart(name, price, quantity){

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    cart.push({
        name: name,
        price: price,
        quantity: parseInt(quantity)
    });

    localStorage.setItem('cart', JSON.stringify(cart));

    alert(name + ' added to cart');
}

function submitOrder(){

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    if(cart.length === 0){
        alert('Please add at least one pulse item to your cart.');
        return;
    }

    window.location.href = 'cart.html';
}

</script>

</body>
</html>
