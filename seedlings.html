<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lawn Grass Store</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #f5f7f6, #e9f5ee);
  margin: 0;
  color: #222;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: #fff;
  padding: 25px;
  text-align: center;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
}

header h1 {
  margin: 0;
  font-size: 28px;
}

/* CONTAINER */
.container {
  width: 90%;
  max-width: 1200px;
  margin: auto;
  padding: 25px 0;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 22px;
}

/* PRODUCT CARD */
.product-card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
  border: 1px solid #eef2ef;
  transition: 0.25s ease;
}

.product-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .12);
}

.product-card img {
  width: 100%;
  height: 210px;
  object-fit: cover;
}

/* CONTENT */
.content {
  padding: 16px;
}

.content h3 {
  margin: 0;
  font-size: 18px;
  color: #1b5e20;
}

/* PRICE */
.price {
  font-size: 22px;
  color: #2e7d32;
  font-weight: 800;
  margin: 10px 0;
}

/* INPUT */
input {
  width: 70px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  border: none;
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: #fff;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  margin-top: 10px;
}

button:hover {
  transform: translateY(-2px);
}

/* FLOATING CART BUTTON */
.checkout-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: #fff;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}
</style>
</head>

<body>

<header>
  <h1>Lawn Grass Seeds</h1>
</header>

<div class="container">
  <div class="grid">

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/collard22.jpg" alt="Bermuda Grass">
      <div class="content">
        <h3>Thousand Headed Seedlings</h3>
        <p>Thousand Headed Seedlings.</p>
        <div class="price">KSh 3-4,875</div>
        <input type="number" min="1" value="1" id="bermuda">
        <button onclick="addToCart('Bermuda Grass', 3-4,875,document.getElementById('bermuda').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/pepper1.jpeg" alt="Long Red Cayenne Seedlings">
      <div class="content">
        <h3>Long Red Cayenne Seedlings</h3>
        <p>Long Red Cayenne Seedlings.</p>
        <div class="price">KSh 5-13,435</div>
        <input type="number" min="1" value="1" id="kikuyu">
        <button onclick="addToCart('Kikuyu Grass',5-13,435,document.getElementById('kikuyu').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/collard3.jpg" alt="Buffalo Grass">
      <div class="content">
        <h3>Gloria F1 Seedlings</h3>
        <p>Gloria F1 Seedlings.</p>
        <div class="price">KSh 4-41,475</div>
        <input type="number" min="1" value="1" id="buffalo">
        <button onclick="addToCart('Buffalo Grass',4-41,475,document.getElementById('buffalo').value)">Add To Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://www.simlaw.co.ke/uploads/product/tomato2.jpeg" alt="Rye Grass">
      <div class="content">
        <h3>Tomato Crown Seedlings</h3>
        <p>Tomato Crown Seedlings.</p>
        <div class="price">KSh 5-18,315</div>
        <input type="number" min="1" value="1" id="rye">
        <button onclick="addToCart('Rye Grass',5-18,315,document.getElementById('rye').value)">Add To Cart</button>
      </div>
    </div>

  </div>
</div>

<button class="checkout-btn" onclick="submitOrder()">Submit Cart🛒</button>

<script>
function addToCart(name, price, quantity){
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  cart.push({
    name: name,
    price: price,
    quantity: parseInt(quantity)
  });

  localStorage.setItem('cart', JSON.stringify(cart));

  alert(name + ' added to cart');
}

function submitOrder(){
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  if(cart.length === 0){
    alert('Please add at least one item to your cart.');
    return;
  }

  window.location.href = 'cart.html';
}
</script>

</body>
</html>
